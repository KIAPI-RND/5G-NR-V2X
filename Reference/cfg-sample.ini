[CLIENT]
CENTER SVR TCP IP ADDR = 198.168.100.10 ;Center Server TCP IP Address
CENTER SVR TCP PORT = 5000 ;Center Server TCP Port
CENTER SVR UDP IP ADDR = 198.168.100.10 ;Center Server UDP IP Address
CENTER SVR UDP PORT = 4000 ;Center Server UDP Port
EXT ETH IF = eth1 ; *** important ***  External Ethernet Interface for Client

[COMMON]
ETH RX BUF SIZE = 8192 ;Ethernet receive buffer size at application layer
HEX DISPLAY BYTE = 10 ;Number of bytes to display in hexadecimal. 0 displays all bytes.
LOG LEVEL = 4 ;0 none, 1 err, 2 important, 3 event, 4 all

[SERVER]
5NV ANT IP ADDR 1 = 198.168.100.20 ;5G NR V2X Antenna IP address
5NV ANT IP ADDR 2 = 198.168.100.21 ;5G NR V2X Antenna IP address
5NV ANT IP ADDR 3 = 198.168.100.22 ;5G NR V2X Antenna IP address
5NV ANT IP ADDR 4 = 198.168.100.10 ;5G NR V2X Antenna IP address
INT ETH IF = eth0 ; *** important ***  Internal Ethernet Interface for Server
MAX CLIENTS = 10 ;Maximum TCP clients number
SUPPORT DEV COM PORT 1 = 1 ;Support Device COM Port Number
SUPPORT DEV COM PORT 2 = 2 ;Support Device COM Port Number
SUPPORT DEV COM PORT 3 = 3 ;Support Device COM Port Number
SUPPORT DEV COM PORT 4 = 4 ;Support Device COM Port Number
TCP PORT = 5000 ;Port for TCP client connection
UDP PORT = 4000 ;Port for UDP client 
